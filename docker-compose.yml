
services:
  backend:
    build:
      context: ./backend
    container_name: knowledgeai-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434/api/generate"
    volumes:
      - ./backend/knowledgeai.db:/app/knowledgeai.db
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: knowledgeai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
